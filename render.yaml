services:
  - type: web
    name: digital-menu
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    disk:
      name: digital-menu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        generateValue: true
